[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "stock_predictor"
version = "0.0.1"
description = "ML model to predict stock prices"
authors = [
  { name = "Adam Wasiak and Kacper Kawecki" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
dependencies = [
    "bertopic",
    "en-core-web-sm",
    "fastcoref",
    "finnhub-python",
    "ipython",
    "jupyterlab",
    "lightgbm",
    "llama-cpp-python==0.3.4",
    "loguru",
    "lxml>=6.1.1",
    "matplotlib",
    "notebook",
    "numpy",
    "nvidia-cublas-cu12",
    "nvidia-cuda-nvrtc-cu12",
    "nvidia-cuda-runtime-cu12",
    "pandas",
    "pandas-market-calendars",
    "pip",
    "pyarrow",
    "pytest",
    "python-dotenv",
    "ruff",
    "scikit-learn",
    "seaborn",
    "sentence-transformers",
    "sentencepiece>=0.2.2",
    "shap",
    "spacy",
    "streamlit",
    "tiktoken>=0.14.0",
    "torch",
    "tqdm",
    "transformers",
    "typer",
    "yfinance",
]
requires-python = "~=3.12.0"


[tool.uv.sources]
llama-cpp-python = { index = "llama-cpp-python-cuda" }
# PyPI's default torch wheel on Windows is the CPU-only build, which leaves
# torch.cuda.is_available() False and pins FinBERT, ABSA and fastcoref to the
# CPU however they are configured. Same version (2.13.0), CUDA-enabled build.
torch = { index = "pytorch-cu126" }
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[[tool.uv.index]]
name = "llama-cpp-python-cuda"
url = "https://abetlen.github.io/llama-cpp-python/whl/cu121"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: hits a real model or the network; deselect with -m 'not slow'",
]

[tool.ruff]
line-length = 99
src = ["stock_predictor"]
include = ["pyproject.toml", "stock_predictor/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["stock_predictor"]
force-sort-within-sections = true

