[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "stock_predictor"
version = "0.0.1"
description = "ML model to predict stock prices"
authors = [
  { name = "Adam Wasiak and Kacper Kawecki" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
dependencies = [
    "bertopic",
    "fastcoref",
    "finnhub-python",
    "ipython",
    "jupyterlab",
    "lightgbm",
    "llama-cpp-python",
    "loguru",
    "lxml>=6.1.1",
    "matplotlib",
    "notebook",
    "numpy",
    "pandas",
    "pandas-market-calendars",
    "pip",
    "pyarrow",
    "pytest",
    "python-dotenv",
    "ruff",
    "scikit-learn",
    "seaborn",
    "sentence-transformers",
    "shap",
    "spacy",
    "streamlit",
    "torch",
    "tqdm",
    "transformers",
    "typer",
    "yfinance",
]
requires-python = "~=3.12.0"


[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: hits a real model or the network; deselect with -m 'not slow'",
]

[tool.ruff]
line-length = 99
src = ["stock_predictor"]
include = ["pyproject.toml", "stock_predictor/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["stock_predictor"]
force-sort-within-sections = true

