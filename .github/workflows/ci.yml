name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ruff
        # Pinned to the version the repo was formatted with, so CI and local agree.
        run: pipx install ruff==0.16.0
      - run: ruff format --check
      - run: ruff check

  test:
    name: Tests (not slow, CPU-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (CPU-only)
        # Plain pip, so the CUDA-pinned indexes in [tool.uv.sources] are ignored.
        # CPU torch is installed first from the PyTorch CPU index; pip install -e .
        # then treats it as already satisfied instead of pulling the large Linux
        # CUDA default wheel. The spaCy model is a URL dependency with no PyPI
        # package, so it is installed by name before the project is.
        # Editable (-e): config.PROJ_ROOT is derived from config.py's own file
        # location, and tests read tracked data (data/eval/) relative to it. A
        # non-editable install copies the package into site-packages, which
        # moves PROJ_ROOT away from the checkout and off every real data file.
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl"
          pip install -e .
          pip install pytest
      - name: Run tests
        # The 'slow' marker gates the tests that load a real model or hit the
        # network (the judge GGUF, the transformer weights), which a CI runner
        # cannot fetch. Everything else runs on CPU.
        run: pytest -m "not slow"
